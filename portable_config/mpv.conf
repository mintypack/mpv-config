
##################
# video settings #
##################

vo=gpu-next
hwdec=auto

#Start mpv with a % smaller resolution of your screen
autofit=50%

#Cursor hide in ms
cursor-autohide=100

# Do not close the window on exit.
keep-open=yes



##################
# 		OSD 	 #
##################

osd-on-seek=msg-bar


##################
## 	 Youtube    ##
##################

script-opts=ytdl_hook-ytdl_path="~~exe_dir/yt-dlp.exe"
ytdl-format=best
ytdl-raw-options=cookies-from-browser
demuxer-max-bytes=150000000 								# Max pre-load for network streams (1 MiB = 1048576 Bytes).
demuxer-max-back-bytes=75000000 							# Max loaded video kept after playback.
force-seekable=yes


##############
# Screenshot #
##############

screenshot-format=png
screenshot-png-compression=7
screenshot-png-filter=0
screenshot-tag-colorspace=yes
screenshot-directory="D:\Pictures\mpv"
screenshot-high-bit-depth=yes
screenshot-template="%F-%P"


##################
# audio settings #
##################

#Default volume of the player
volume=60

#Audio language priority
alang=ja,jp,jpn,en,eng

#Allow only mpv to send direct audio signals to the soundbar
#You need to activate "exclusive mode" in your sound driver on Windows
#This is highly recommended for a multi channel soundbar
audio-exclusive=yes


#Channels that your device supports
#"auto-safe" only sends channels that your active audio device can handle, which can cause issues for an ARC/eARC setup (uses TV instead of soundbar) 
#"auto" sends every channels as they're, which works for an eARC/ARC setup but also can cause issues if your sound device doesn't support certain channel setups
#An alternative is to set up a whitelist for supported channels
audio-channels=stereo,5.1,7.1


#############
# Subtitles #
#############

sub-fix-timing=yes

#Subtitle language priority
slang=en,eng

# Sub styling
sub-font=Andika New Basic Bold
sub-font-size=45
sub-blur=0.2
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3.0
sub-color=1.0/1.0/1.0/1.0
sub-margin-x=100
sub-margin-y=25
sub-shadow-color=0.0/0.0/0.0/0.25
sub-shadow-offset=0


#################
#	  Cache		#
#################

cache=yes
cache-secs=120


###################
# Script Settings #
###################



############
# Profiles #
############

profile=high-quality