include="~~/profiles.conf"          # shader presets & auto profiles

##################
#     Video      #
##################

profile=high-quality                # default look: no shaders
vo=gpu-next
gpu-api=d3d11                       # Windows default; try vulkan if shaders stutter
hwdec=auto-safe

autofit=50%
cursor-autohide=1000
keep-open=yes
save-position-on-quit=yes

# Off by default; CTRL+i toggles it (profiles.conf switches video-sync for you)
interpolation=no
tscale=oversample


##################
#      OSD       #
##################

osd-on-seek=msg-bar
osc=no                              # uosc replaces the built-in controller
osd-bar=no                          # uosc draws its own timeline/volume bars


##################
#    YouTube     #
##################

# yt-dlp.exe next to mpv.exe is found automatically
ytdl-format=bestvideo[height<=?2160]+bestaudio/best
ytdl-raw-options=cookies-from-browser=firefox
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
force-seekable=yes


##################
#   Screenshot   #
##################

screenshot-format=png
screenshot-png-compression=7
screenshot-png-filter=0
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
screenshot-dir="D:\Pictures\mpv"
screenshot-template="%{media-title:%F} - %P"   # title (Plex sets it), falls back to filename


##################
#     Audio      #
##################

volume=80
alang=ja,jp,jpn,en,eng

# Passthrough (bitstream) on by default: the TV/AVR decodes Dolby/DTS itself.
# mpv only uses it if the output device accepts the format; otherwise (e.g. the
# headphone interface) it falls back to decoding. ALT+d toggles decoding manually.
# Passthrough switches WASAPI to exclusive mode on its own; PCM stays shared.
audio-spdif=ac3,eac3,dts-hd,truehd  # dts-hd also covers plain DTS
audio-channels=auto-safe            # decoded audio: use the device's channel layout, downmix the rest
audio-exclusive=no


##################
#   Subtitles    #
##################

slang=en,eng,en-US,enUS
sub-auto=fuzzy                      # load external .ass even if name differs slightly
sub-file-paths=**                   # fuzzydir.lua: search all subfolders

# Styling below only affects plain-text subs (SRT). ASS keeps its own.
sub-font=Andika New Basic
sub-bold=yes
sub-font-size=45
sub-blur=0.2
sub-color=1.0/1.0/1.0/1.0
sub-outline-color=0.0/0.0/0.0/1.0
sub-outline-size=3.0
sub-shadow-offset=0
sub-margin-x=100
sub-margin-y=25


##################
#     Cache      #
##################

cache=yes
cache-secs=120
