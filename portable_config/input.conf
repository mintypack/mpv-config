# KEY            [prefix] command args            (then: hash+bang + menu title)
#
# uosc builds the right-click menu from a hash+bang comment at the end of a binding;
# "A > B" makes a submenu, a bare hash as the KEY gives a menu-only item.
# NOTE: don't write a hash followed by ! in plain comments - uosc reads every
# line, so it would show up as a menu item. Defining any item replaces uosc's default menu.

# --- Menu --------------------------------------------------------------------
MBTN_RIGHT       script-binding uosc/menu
MENU             script-binding uosc/menu
TAB              script-binding uosc/menu                               # keyboard menu key
SHIFT+TAB        script-message-to uosc show-submenu "Video > Shaders"  # jump to shader presets

# --- File --------------------------------------------------------------------
#                script-binding uosc/open-file                          #! File > Open file
r                script-binding memo-history                            #! File > Recent files
#                script-binding uosc/items                              #! File > Playlist
#                script-binding uosc/chapters                           #! File > Chapters
#                script-binding uosc/editions                           #! File > Editions
n                playlist-next                                          #! File > Next
p                playlist-prev                                          #! File > Previous
#                script-binding uosc/show-in-directory                  #! File > Show in folder
#                script-binding uosc/stream-quality                     #! File > Stream quality

# --- Playback ----------------------------------------------------------------
SPACE            cycle pause                                            #! Playback > Play / Pause
ENTER            cycle pause
MBTN_LEFT_DBL    cycle fullscreen                                       #! Playback > Fullscreen
RIGHT            script-binding evafast/evafast                         #! Playback > Seek +5s (hold = fast-forward)
LEFT             seek -5                                                #! Playback > Seek -5s
ALT+RIGHT        seek  10 exact                                         #! Playback > Seek +10s exact
ALT+LEFT         seek -10 exact                                         #! Playback > Seek -10s exact
CTRL+RIGHT       seek  60                                               #! Playback > Seek +60s
CTRL+LEFT        seek -60                                               #! Playback > Seek -60s
SHIFT+RIGHT      frame-step                                             #! Playback > Next frame
SHIFT+LEFT       frame-back-step                                        #! Playback > Previous frame
MBTN_BACK        playlist-prev
MBTN_FORWARD     playlist-next

SHIFT+UP         ignore
SHIFT+DOWN       ignore
ALT+UP           ignore
ALT+DOWN         ignore
q                ignore                                                 # no accidental quits
Q                ignore

# --- Audio -------------------------------------------------------------------
UP               add volume  5 ; script-binding uosc/flash-volume
DOWN             add volume -5 ; script-binding uosc/flash-volume
CTRL+UP          add volume  5 ; script-binding uosc/flash-volume
CTRL+DOWN        add volume -5 ; script-binding uosc/flash-volume
WHEEL_UP         add volume  5 ; script-binding uosc/flash-volume
WHEEL_DOWN       add volume -5 ; script-binding uosc/flash-volume
WHEEL_RIGHT      ignore
WHEEL_LEFT       ignore
b                script-binding uosc/audio                              #! Audio > Tracks
m                cycle mute                                             #! Audio > Mute
#                script-binding uosc/audio-device                       #! Audio > Output device
ALT+a            show-text "Audio: ${audio-codec-name}  ${audio-params/channel-count}ch -> ${audio-out-params/channel-count}ch  ${audio-out-params/samplerate} Hz  ${audio-out-params/format}\nDevice: ${audio-device}" 4000 #! Audio > Show output info
ALT+d            cycle-values audio-spdif "" "ac3,eac3,dts-hd,truehd" ; show-text "Passthrough: ${?audio-spdif==:off (mpv decodes)}${!audio-spdif==:on (${audio-spdif})}" #! Audio > Toggle passthrough / decode
j                add audio-delay -0.1                                   #! Audio > Delay -100ms
k                add audio-delay +0.1                                   #! Audio > Delay +100ms
CTRL+j           set audio-delay 0 ; show-text "Audio delay reset"      #! Audio > Reset delay
#                apply-profile downmix-stereo ; show-text "Downmix: stereo + dialogue boost" #! Audio > Downmix > Stereo + dialogue boost
#                af clr "" ; show-text "Downmix: off"                   #! Audio > Downmix > Off

# --- Subtitles ---------------------------------------------------------------
v                cycle sub                                              #! Subtitles > Next track
V                cycle sub down                                         #! Subtitles > Previous track
#                script-binding uosc/subtitles                          #! Subtitles > Select track
#                script-binding uosc/load-subtitles                     #! Subtitles > Load file
g                add sub-delay -0.1                                     #! Subtitles > Delay -100ms
h                add sub-delay +0.1                                     #! Subtitles > Delay +100ms
CTRL+g           set sub-delay 0 ; show-text "Sub delay reset"          #! Subtitles > Reset delay
=                add sub-scale +0.1                                     #! Subtitles > Bigger
-                add sub-scale -0.1                                     #! Subtitles > Smaller
+                add sub-pos +1                                         #! Subtitles > Move down
_                add sub-pos -1                                         #! Subtitles > Move up
CTRL+s           cycle-values sub-ass-override "scale" "force"          #! Subtitles > Toggle my style on ASS

# --- Video -------------------------------------------------------------------
#                script-binding uosc/video                              #! Video > Tracks
o                cycle video-unscaled                                   #! Video > Toggle unscaled
O                cycle video-unscaled
a                cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no" #! Video > Cycle aspect ratio
CTRL+i           cycle interpolation                                    #! Video > Toggle interpolation
~                cycle ontop                                            #! Video > Always on top

# --- Shaders (presets live in profiles.conf) ---------------------------------
CTRL+1           apply-profile ani4k ; show-text "Shaders: Ani4Kv2 ArtCNN"          #! Video > Shaders > Anime: Ani4Kv2 (720p/1080p)
CTRL+2           apply-profile anisd ; show-text "Shaders: AniSD ArtCNN"            #! Video > Shaders > Anime: AniSD (SD/DVD)
CTRL+3           apply-profile artcnn-light ; show-text "Shaders: ArtCNN C4F16"     #! Video > Shaders > Anime: ArtCNN C4F16 (lighter)
CTRL+4           apply-profile fsrcnnx ; show-text "Shaders: FSRCNNX 16"            #! Video > Shaders > Live action: FSRCNNX 16
CTRL+5           apply-profile fsrcnnx-anime ; show-text "Shaders: FSRCNNX anime_enhance" #! Video > Shaders > Anime: FSRCNNX anime_enhance
CTRL+6           apply-profile anime4k-a ; show-text "Shaders: Anime4K A"           #! Video > Shaders > Anime4K > Mode A
CTRL+7           apply-profile anime4k-b ; show-text "Shaders: Anime4K B"           #! Video > Shaders > Anime4K > Mode B
CTRL+8           apply-profile anime4k-c ; show-text "Shaders: Anime4K C"           #! Video > Shaders > Anime4K > Mode C
CTRL+0           change-list glsl-shaders clr "" ; show-text "Shaders: off"         #! Video > Shaders > Off (high-quality only)

# --- Tools -------------------------------------------------------------------
t                show-progress                                          #! Tools > Show progress
T                no-osd cycle-values osd-level 3 1                      #! Tools > Cycle OSD level
i                script-binding stats/display-stats-toggle              #! Tools > Stats (check GPU frame times)
S                screenshot                                             #! Tools > Screenshot (with subs)
s                screenshot video                                       #! Tools > Screenshot (no subs)
