##############################################################################
# profiles.conf  (loaded from mpv.conf via include="~~/profiles.conf")
#
# Shader presets are applied by hotkey / uosc menu (see input.conf).
# Default playback uses only profile=high-quality, no shaders.
# CTRL+0 clears shaders again.
##############################################################################


# ---------------------------------------------------------------------------
# Auto profiles
# ---------------------------------------------------------------------------

# Interpolation needs display-resample; turn it on only while interpolation is on
[interpolation-sync]
profile-desc=Use display-resample while interpolation is enabled
profile-cond=get("interpolation")
profile-restore=copy
video-sync=display-resample


# ---------------------------------------------------------------------------
# Shader presets (manual) - paths match portable_config/shaders/
# ArtCNN/FSRCNNX upscale luma (detail) only. CfL_Prediction upscales chroma
# (color, stored at 1/4 resolution) using the luma as a guide. Cheap.
# ---------------------------------------------------------------------------

[ani4k]
profile-desc=Anime 720p/1080p -> 4K (ArtCNN Ani4Kv2)
glsl-shaders="~~/shaders/Ani4Kv2/Ani4Kv2_ArtCNN_C4F32_i2_CMP.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[anisd]
profile-desc=Anime SD/DVD (ArtCNN AniSD)
glsl-shaders="~~/shaders/Ani4Kv2/AniSD_ArtCNN_C4F32_i4.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[artcnn-light]
profile-desc=Anime, lighter GPU load (ArtCNN C4F16)
glsl-shaders="~~/shaders/ArtCNN/ArtCNN_C4F16.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[fsrcnnx]
profile-desc=Live action (FSRCNNX 16)
glsl-shaders="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[fsrcnnx-anime]
profile-desc=Anime, also cleans compression (FSRCNNX 16 anime_enhance)
glsl-shaders="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_anime_enhance.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

# Anime4K, trimmed for a 4K display: one x2 pass (1080p -> 4K).
# The official template adds AutoDownscalePre + a second x2 pass for
# smaller sources; not needed here, mpv's scaler covers the rest.
# A = blurry/compressed, B = softer restore (fewer artifacts), C = clean sources
[anime4k-a]
profile-desc=Anime4K Mode A (HQ)
glsl-shaders="~~/shaders/Anime4K/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[anime4k-b]
profile-desc=Anime4K Mode B (HQ)
glsl-shaders="~~/shaders/Anime4K/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/Restore/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"

[anime4k-c]
profile-desc=Anime4K Mode C (HQ)
glsl-shaders="~~/shaders/Anime4K/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/Upscale-Denoise/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Chroma/CfL_Prediction.glsl"


# ---------------------------------------------------------------------------
# Audio (manual)
# ---------------------------------------------------------------------------

# 5.1/7.1 -> stereo with louder dialogue (center channel). For TV speakers/headphones.
[downmix-stereo]
profile-desc=Stereo downmix with dialogue boost
profile-restore=copy
af=lavfi="pan=stereo|FL=0.707*FC+0.5*FL+0.35*BL+0.35*SL+0.3*LFE|FR=0.707*FC+0.5*FR+0.35*BR+0.35*SR+0.3*LFE"
